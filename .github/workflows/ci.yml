name: CI (Pull Request)

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Test backend monolita
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Esegui i test
        working-directory: backend/digital-agenda-private
        run: ./mvnw test

  notification-tests:
    name: Test notification-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Esegui i test
        working-directory: backend/notification-service
        run: ./mvnw test

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/digital-agenda-ui/package-lock.json
      - name: Installa dipendenze
        working-directory: frontend/digital-agenda-ui
        run: npm ci
      - name: Build
        working-directory: frontend/digital-agenda-ui
        run: npm run build
