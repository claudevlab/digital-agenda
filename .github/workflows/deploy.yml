name: Build & Deploy (Home Server)

on:
  push:
    branches: [ "main" ]

# Se arriva un secondo push mentre un deploy è in corso, il primo viene annullato
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1-3: Build immagini Docker (multi-stage, compilano da sé)
  # ─────────────────────────────────────────────
  build-monolita:
    name: Build & Push immagine monolita
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Login su Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build e Push
      uses: docker/build-push-action@v6
      with:
        context: ./backend/digital-agenda-private
        push: true
        platforms: linux/amd64
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/digital-agenda-monolita:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/digital-agenda-monolita:${{ github.sha }}

  build-notification-service:
    name: Build & Push immagine notification
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Login su Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build e Push
      uses: docker/build-push-action@v6
      with:
        context: ./backend/notification-service
        push: true
        platforms: linux/amd64
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/digital-agenda-notification:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/digital-agenda-notification:${{ github.sha }}

  build-frontend:
    name: Build & Push immagine frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Login su Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build e Push
      uses: docker/build-push-action@v6
      with:
        context: ./frontend/digital-agenda-ui
        push: true
        platforms: linux/amd64
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/digital-agenda-frontend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/digital-agenda-frontend:${{ github.sha }}

  # ─────────────────────────────────────────────
  # JOB 4: Deploy sull'home server (self-hosted runner)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy su home server
    runs-on: [self-hosted, digital-agenda-home]
    needs: [build-monolita, build-notification-service, build-frontend]
    environment: production
    steps:
    - name: Allinea il repository sul server
      run: |
        cd /home/claudev/digital-agenda
        git fetch origin main
        git reset --hard origin/main

    - name: Salva il tag attualmente in produzione
      run: |
        cd /home/claudev/digital-agenda
        if [ -f .deployed_tag ]; then cat .deployed_tag; else echo "latest"; fi > /tmp/prev_tag
        echo "Tag precedente: $(cat /tmp/prev_tag)"

    - name: Pull nuove immagini e ricrea i container
      run: |
        cd /home/claudev/digital-agenda
        export IMAGE_TAG=${{ github.sha }}
        docker compose pull frontend monolita notification-service
        docker compose up -d --no-deps --force-recreate frontend monolita notification-service
        docker image prune -f

    - name: Healthcheck (frontend 200, backend 401 atteso)
      run: |
        ok=0
        for i in $(seq 1 12); do
          fe=$(curl -s -o /dev/null -w "%{http_code}" --resolve digital-agenda.it:443:127.0.0.1 https://digital-agenda.it/)
          be=$(curl -s -o /dev/null -w "%{http_code}" --resolve api.digital-agenda.it:443:127.0.0.1 https://api.digital-agenda.it/actuator/health)
          echo "tentativo $i: frontend=$fe backend=$be"
          if [ "$fe" = "200" ] && [ "$be" = "401" ]; then ok=1; break; fi
          sleep 5
        done
        [ "$ok" = "1" ] || { echo "HEALTHCHECK FALLITO"; exit 1; }

    - name: Registra il tag deployato
      run: echo "${{ github.sha }}" > /home/claudev/digital-agenda/.deployed_tag

    - name: ROLLBACK automatico (solo se qualcosa sopra è fallito)
      if: failure()
      run: |
        cd /home/claudev/digital-agenda
        PREV=$(cat /tmp/prev_tag)
        echo "Rollback al tag precedente: $PREV"
        export IMAGE_TAG=$PREV
        docker compose pull frontend monolita notification-service
        docker compose up -d --no-deps --force-recreate frontend monolita notification-service
        exit 1