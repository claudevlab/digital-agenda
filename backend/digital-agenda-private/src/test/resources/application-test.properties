# Database H2 in memoria, compatibilita' MySQL
spring.datasource.url=jdbc:h2:mem:agendatest;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate ricrea lo schema a ogni avvio del test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.show_sql=false

# JWT: valori fittizi, sufficienti per avviare il contesto
jwt.secret=questa-e-una-chiave-di-test-lunga-per-superare-il-limite-di-sessantaquattro-caratteri
jwt.expiration=1800000

# OAuth2: credenziali fittizie, non viene fatto nessun login reale
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# Redis e RabbitMQ: valori di default, le connessioni sono lazy
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=